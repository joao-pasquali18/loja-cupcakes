<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar conta - Doce Cupcake</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="cabecalho">
    <a href="/" class="logo">🧁 Doce Cupcake</a>
    <nav>
      <a href="/carrinho.html" class="link-carrinho">
        Carrinho (<span id="contador-carrinho">0</span>)
      </a>
    </nav>
  </header>

  <main class="conteudo">
    <form id="form-cadastro" class="formulario-card" novalidate>
      <h1>Criar conta</h1>

      <div class="campo">
        <label for="nome">Nome</label>
        <input id="nome" type="text" autocomplete="name" required>
      </div>
      <div class="campo">
        <label for="email">E-mail</label>
        <input id="email" type="email" autocomplete="email" required>
      </div>
      <div class="campo">
        <label for="senha">Senha (mínimo 6 caracteres)</label>
        <input id="senha" type="password" autocomplete="new-password" required>
      </div>

      <p id="mensagem" class="mensagem"></p>
      <button type="submit" class="botao">Cadastrar</button>
      <p class="link-alternativo">Já tem conta? <a id="link-login" href="/login.html">Entrar</a></p>
    </form>
  </main>

  <script src="js/sessao.js"></script>
  <script src="js/carrinho.js"></script>
  <script src="js/cadastro.js"></script>
</body>
</html>
