<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar - Doce Cupcake</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="cabecalho">
    <a href="/" class="logo">🧁 Doce Cupcake</a>
    <nav>
      <a href="/carrinho.html" class="link-carrinho">
        Carrinho (<span id="contador-carrinho">0</span>)
      </a>
    </nav>
  </header>

  <main class="conteudo">
    <form id="form-login" class="formulario-card" novalidate>
      <h1>Entrar</h1>

      <div class="campo">
        <label for="email">E-mail</label>
        <input id="email" type="email" autocomplete="email" required>
      </div>
      <div class="campo">
        <label for="senha">Senha</label>
        <input id="senha" type="password" autocomplete="current-password" required>
      </div>

      <p id="mensagem" class="mensagem"></p>
      <button type="submit" class="botao">Entrar</button>
      <p class="link-alternativo">Ainda não tem conta? <a id="link-cadastro" href="/cadastro.html">Cadastre-se</a></p>
    </form>
  </main>

  <script src="js/sessao.js"></script>
  <script src="js/carrinho.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
